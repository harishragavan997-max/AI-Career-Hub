            <div class="feature-row">

/* =========================
   LANGUAGE CHANGE
========================= */

function changeLanguage() {

    const lang =
        document.getElementById("languageSelect").value;

    const t =
        translations[lang];


    document.getElementById("pageTitle").innerText =
        t.pageTitle;

    document.getElementById("loginTitle").innerText =
        t.loginTitle;

    document.getElementById("usernameLabel").innerText =
        t.usernameLabel;

    document.getElementById("passwordLabel").innerText =
        t.passwordLabel;

    document.getElementById("loginButton").innerText =
        t.loginButton;

    document.getElementById("dashboardTitle").innerText =
        t.dashboardTitle;

    document.getElementById("usersTitle").innerText =
        t.usersTitle;

    document.getElementById("visitorsTitle").innerText =
        t.visitorsTitle;

    document.getElementById("todayVisitorsTitle").innerText =
        t.todayVisitorsTitle;

    document.getElementById("applicationsTitle").innerText =
        t.applicationsTitle;

    document.getElementById("featureTitle").innerText =
        t.featureTitle;

    document.getElementById("practiceLabel").innerText =
        t.practiceLabel;

    document.getElementById("interviewLabel").innerText =
        t.interviewLabel;

    document.getElementById("assessmentLabel").innerText =
        t.assessmentLabel;

    document.getElementById("jobsLabel").innerText =
        t.jobsLabel;

}


/* =========================
   ADMIN LOGIN
========================= */

async function adminLogin() {

    const username =
        document.getElementById("adminUsername").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    try {

        const response = await fetch("/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "username=" + encodeURIComponent(username) +
                "&password=" + encodeURIComponent(password)
        });

        const data = await response.json();

        if (data.success) {

            document.getElementById("adminMessage").innerText =
                data.message + " 🚀";

            document.getElementById("adminPanel").style.display =
                "block";

            loadUserCount();
            loadAdminVisitorCount();
            loadTodayVisitorCount();
            loadFeatureUsage();

        } else {

            document.getElementById("adminMessage").innerText =
                data.message + " ❌";

            document.getElementById("adminPanel").style.display =
                "none";
        }

    } catch (error) {

        console.error("Admin login error:", error);

        document.getElementById("adminMessage").innerText =
            "Server error ❌";

        document.getElementById("adminPanel").style.display =
            "none";
    }
}


/* =========================
   TOTAL USERS
========================= */

async function loadUserCount() {

    try {

        const response =
            await fetch("/admin/user-count");

        if (!response.ok) {
            throw new Error("User API failed");
        }

        const data =
            await response.json();

        document.getElementById("userCount").innerText =
            data.total_users;

    }

    catch (error) {

        console.error("User error:", error);

        document.getElementById("userCount").innerText =
            "Unable to load";

    }

}


/* =========================

========================= */

}

/* =========================
   FEATURE USAGE + APPLICATIONS
========================= */

async function loadFeatureUsage() {

    try {

        const response = await fetch("/admin/analytics", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Analytics API failed: " + response.status);
        }

        const data = await response.json();

        document.getElementById("practiceCount").innerText =
            data.practice ?? 0;

        document.getElementById("interviewCount").innerText =
            data.mock_interview ?? 0;

        document.getElementById("assessmentCount").innerText =
            data.skill_assessment ?? 0;

        document.getElementById("jobsCount").innerText =
            data.jobs ?? 0;

    } catch (error) {

        console.error("Feature usage error:", error);

        document.getElementById("practiceCount").innerText = "—";
        document.getElementById("interviewCount").innerText = "—";
        document.getElementById("assessmentCount").innerText = "—";
        document.getElementById("jobsCount").innerText = "—";

    }


    // APPLICATION COUNT

    try {

        const response = await fetch("/admin/application-count", {
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Application API failed: " + response.status);
        }

        const data = await response.json();

        document.getElementById("applicationCount").innerText =
            data.total_applications ?? 0;

    } catch (error) {

        console.error("Application count error:", error);

        document.getElementById("applicationCount").innerText = "—";

    }

}
