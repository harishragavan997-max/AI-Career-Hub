<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Career Hub - Practice</title>

<link rel="stylesheet"
      href="style.css">
      <link rel="stylesheet" href="mobile-responsive.css">

<script src="course-data.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at top left,
            rgba(59,130,246,0.20),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(139,92,246,0.20),
            transparent 35%
        ),
        #020617;
    color: #f8fafc;
}

.practice-page {
    min-height: 100vh;
    padding: 30px 20px 50px;
}

.practice-wrapper {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.practice-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.brand-area h1 {
    margin: 0;
    font-size: 32px;
    color: #ffffff;
}

.brand-area p {
    margin: 8px 0 0;
    color: #94a3b8;
}

.language-area select {
    min-width: 160px;
}

.glass-card {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(99,102,241,0.30);
    border-radius: 24px;
    padding: 30px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.40);
    backdrop-filter: blur(18px);
}

.setup-card {
    margin-top: 20px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 9px;
    color: #e2e8f0;
    font-weight: 600;
}

.form-group select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 13px;
    border: 1px solid rgba(148,163,184,0.30);
    background: #0f172a;
    color: #ffffff;
    outline: none;
    font-size: 15px;
}

.form-group select:focus {
    border-color: #60a5fa;
    box-shadow:
        0 0 0 3px rgba(96,165,250,0.15);
}

.primary-btn,
.secondary-btn,
.danger-btn {
    border: none;
    border-radius: 13px;
    padding: 13px 20px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: 0.25s ease;
}

.primary-btn {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
    color: #ffffff;
}

.primary-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 12px 30px rgba(37,99,235,0.30);
}

.secondary-btn {
    background: rgba(51,65,85,0.85);
    color: #ffffff;
}

.secondary-btn:hover {
    background: rgba(71,85,105,0.95);
}

.danger-btn {
    background: #dc2626;
    color: #ffffff;
}

.hidden {
    display: none !important;
}

.question-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.career-display {
    color: #60a5fa;
    font-weight: 700;
}

.progress-area {
    margin: 20px 0 28px;
}

.progress-track {
    width: 100%;
    height: 9px;
    background: #1e293b;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #8b5cf6
        );
    transition: width 0.3s ease;
}

.question-box {
    padding: 25px;
    background: rgba(30,41,59,0.75);
    border: 1px solid rgba(96,165,250,0.25);
    border-radius: 20px;
}

.question-number {
    color: #60a5fa;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 15px;
}

.question-text {
    font-size: 21px;
    line-height: 1.55;
    color: #ffffff;
    font-weight: 700;
    margin-bottom: 22px;
}

.option {
    display: block;
    padding: 15px;
    margin: 12px 0;
    border: 1px solid rgba(148,163,184,0.25);
    border-radius: 14px;
    background: rgba(15,23,42,0.80);
    color: #e2e8f0;
    cursor: pointer;
    transition: 0.2s ease;
}

.option:hover {
    border-color: #60a5fa;
    transform: translateX(2px);
}

.option.selected {
    border-color: #60a5fa;
    background: rgba(37,99,235,0.18);
    color: #ffffff;
}

.option input {
    margin-right: 10px;
    accent-color: #3b82f6;
}

.question-buttons {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.result-card {
    text-align: center;
}

.score-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );
    box-shadow:
        0 20px 50px rgba(37,99,235,0.30);
}

.score-circle span {
    font-size: 38px;
    font-weight: 800;
    color: #ffffff;
}

.result-message {
    margin-top: 20px;
    padding: 20px;
    border-radius: 18px;
    background: #111827 !important;
    color: #ffffff !important;
    border: 1px solid rgba(96,165,250,0.35);
    line-height: 1.7;
}

.result-grid {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.result-box {
    padding: 20px;
    border-radius: 16px;
    background: rgba(30,41,59,0.80);
    border: 1px solid rgba(148,163,184,0.18);
}

.result-box h3 {
    margin: 0 0 8px;
    color: #94a3b8;
    font-size: 14px;
}

.result-box strong {
    color: #ffffff;
    font-size: 24px;
}

.bottom-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.status-text {
    margin-top: 12px;
    color: #94a3b8;
    font-size: 14px;
}

@media (max-width: 700px) {

    .practice-page {
        padding: 18px 12px 35px;
    }

    .glass-card {
        padding: 20px;
        border-radius: 18px;
    }

    .brand-area h1 {
        font-size: 25px;
    }

    .question-text {
        font-size: 18px;
    }

    .result-grid {
        grid-template-columns: 1fr;
    }

    .question-buttons button,
    .bottom-actions button {
        width: 100%;
    }
}

</style>
</head>

    <!-- =========================
         SETUP SCREEN
    ========================== -->

    <div
        id="setupScreen"

    >

        <h2 id="setupTitle">
            Start Practice
        </h2>


        <div class="form-group">

            <label id="careerLabel">
                Select Career
            </label>

            <select id="careerSelect">

                <option value="">
                    Select a career
                </option>

            </select>

        </div>


        <div class="form-group">

            <label id="levelLabel">
                Select Level
            </label>

            <select id="levelSelect">

                    Select level
                </option>

                    Beginner
                </option>

                <option value="Intermediate">
                    Intermediate
                </option>

                <option value="Advanced">
                    Advanced
                </option>

            </select>

        </div>


        <button
            id="startBtn"
            class="primary-btn"
            type="button"

            Start Practice
        </button>


        <div class="status-text"
             id="courseStatus">
        </div>


        <div class="bottom-actions">

            <button
                id="dashboardBtnSetup"
                class="secondary-btn"
                type="button"
            >
                Go Back Dashboard
            </button>

        </div>

    </div>


    <!-- =========================
         TEST SCREEN
    ========================== -->

    <div
        id="testScreen"
        class="glass-card hidden"
    >

        <div class="question-top">

            <div>

                <strong id="careerDisplay">
                    -
                </strong>

            </div>

            <div id="questionCounter">
                Question 1 of 25
            </div>

        </div>


        <div class="progress-area">

            <div class="progress-track">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>


        <div id="questionsContainer">
        </div>


        <div class="question-buttons">

            <button
                id="previousBtn"
                class="secondary-btn"
                type="button"
            >
                Previous
            </button>


            <button
                id="nextBtn"
                class="primary-btn"
                type="button"
            >
                Next
            </button>


            <button
                id="submitBtn"
                class="primary-btn"
                type="button"
                style="display:none;"
            >
                Submit Test
            </button>

        </div>

    </div>


    <!-- =========================
         RESULT SCREEN
    ========================== -->

    <div
        id="resultScreen"
        class="glass-card result-card hidden"
    >

        <h2 id="resultTitle">
            Practice Result
        </h2>


        <div class="score-circle">

            <span id="scoreValue">
                0
            </span>

        </div>


        <div class="result-grid">

            <div class="result-box">

                <h3 id="correctLabel">
                    Correct
                </h3>

                <strong id="correctValue">
                    0
                </strong>

            </div>


            <div class="result-box">

                <h3 id="totalLabel">
                    Total
                </h3>

                <strong id="totalValue">
                    0
                </strong>

            </div>


            <div class="result-box">

                <h3 id="levelResultLabel">
                    Level
                </h3>

                <strong id="resultLevel">
                    -
                </strong>

            </div>

        </div>


        <div
            id="resultMessage"
            class="result-message"
        ></div>


        <div class="bottom-actions">

            <button
                id="retryBtn"
                class="primary-btn"
                type="button"
            >
                Retry
            </button>


            <button
                id="dashboardBtnResult"
                class="secondary-btn"
                type="button"
            >
                Go Back Dashboard
            </button>

        </div>

    </div>

</div>

</div>

/* ==========================================
   COURSE SKILLS
========================================== */

function getCourseSkills(career) {

    if (
        typeof courseCatalog === "undefined" ||
        !courseCatalog
    ) {
        return [];
    }


    const data =
        courseCatalog[career];


    if (!data) {
        return [];
    }


    if (Array.isArray(data)) {
        return data;
    }


    if (Array.isArray(data.skills)) {
        return data.skills;
    }


    if (Array.isArray(data.requiredSkills)) {
        return data.requiredSkills;
    }


    if (Array.isArray(data.required_skills)) {
        return data.required_skills;
    }


    return [];
}


/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];
    }


    return copy;
}


/* ==========================================
   USED QUESTION STORAGE
========================================== */

function getUsedQuestions(career) {

    const key =
        "practice_used_" +
        career;


    try {

        return JSON.parse(
            localStorage.getItem(key)
        ) || [];

    } catch {

        return [];
    }
}


function saveUsedQuestions(
    career,
    used
) {

    const key =
        "practice_used_" +
        career;


    localStorage.setItem(
        key,
        JSON.stringify(used)
    );
}


/* ==========================================
   GENERATE 25 COURSE QUESTIONS
========================================== */

function generateQuestions(career) {

    const skills =
        getCourseSkills(career);


    if (!skills.length) {
        return [];
    }


    /*
       Each skill can produce multiple
       question patterns.
    */

    const patterns = [

        skill =>
            ({
                q:
                    `Which skill is directly related to ${career}?`,

                correct:
                    skill,

                options:
                    skills
                    .filter(
                        item =>
                            item !== skill
                    )
                    .slice(0, 3)
            }),


        skill =>
            ({
                q:
                    `Which of the following is an important skill for ${career}?`,

                correct:
                    skill,

                options:
                    skills
                    .filter(
                        item =>
                            item !== skill
                    )
                    .slice(0, 3)
            }),


        skill =>
            ({
                q:
                    `Which skill can be useful when working as a ${career}?`,

                correct:
                    skill,

                options:
                    skills
                    .filter(
                        item =>
                            item !== skill
                    )
                    .slice(0, 3)
            }),


        skill =>
            ({
                q:
                    `Which skill should a ${career} understand?`,

                correct:
                    skill,

                options:
                    skills
                    .filter(
                        item =>
                            item !== skill
                    )
                    .slice(0, 3)
            }),


        skill =>
            ({
                q:
                    `Which skill belongs to the skill set of a ${career}?`,

                correct:
                    skill,

                options:
                    skills
                    .filter(
                        item =>
                            item !== skill
                    )
                    .slice(0, 3)
            })

    ];


    let pool = [];


    /*
       Generate questions from every skill.
    */

    skills.forEach(
        function(skill, skillIndex) {

            patterns.forEach(
                function(makeQuestion, patternIndex) {

                    const item =
                        makeQuestion(skill);


                    let options = [
                        item.correct,
                        ...item.options
                    ];


                    options =
                        [...new Set(options)];


                    /*
                       If course has fewer than
                       4 different skills, fill
                       remaining options.
                    */

                    while(
                        options.length < 4
                    ) {

                        options.push(
                            "None of these"
                        );
                    }


                    options =
                        shuffle(
                            options.slice(0, 4)
                        );


                    pool.push({

                        id:
                            career +
                            "_" +
                            skillIndex +
                            "_" +
                            patternIndex,

                        q:
                            item.q,

                        options:
                            options,

                        answer:
                            options.indexOf(
                                item.correct
                            )

                    });

                }
            );

        }
    );


    /*
       No repeat system.
    */

    let used =
        getUsedQuestions(career);


    let available =
        pool
        .map(
            (_, index) =>
                index
        )
        .filter(
            index =>
                !used.includes(index)
        );


    /*
       If remaining questions are less
       than 25, start a fresh cycle.
    */

    if(
        available.length <
        TOTAL_QUESTIONS
    ) {

        used = [];

        available =
            pool.map(
                (_, index) =>
                    index
            );
    }


    const selected =
        shuffle(
            available
        ).slice(
            0,
            Math.min(
                TOTAL_QUESTIONS,
                pool.length
            )
        );


    saveUsedQuestions(
        career,
        [
            ...used,
            ...selected
        ]
    );


    return selected.map(
        index =>
            pool[index]
    );
}
/* ==========================================
   START TEST
========================================== */

function startTest() {

    currentCareer =
        document.getElementById("careerSelect").value;

    currentLevel =
        document.getElementById("levelSelect").value;

    const lang =
        document.getElementById("languageSelect").value;

    if (!currentCareer || !currentLevel) {

        alert(
            translations[lang].invalid
        );

        return;
    }

    currentQuestions =
        generateQuestions(currentCareer);

    if (
        !currentQuestions ||
        currentQuestions.length === 0
    ) {

        alert(
            translations[lang].unavailable
        );

        return;
    }

    currentQuestionIndex = 0;

    answers =
        new Array(
            currentQuestions.length
        ).fill(null);

    document
        .getElementById("setupScreen")
        .classList.add("hidden");

    document
        .getElementById("resultScreen")
        .classList.add("hidden");

    document
        .getElementById("testScreen")
        .classList.remove("hidden");

    document
        .getElementById("careerDisplay")
        .textContent =
            currentCareer;

    renderCurrentQuestion();
}

/* ==========================================
   RENDER QUESTION
========================================== */

function renderCurrentQuestion() {

    const question =
        currentQuestions[
            currentQuestionIndex
        ];


    if (!question) {
        return;
    }


    const container =
        document
        .getElementById(
            "questionsContainer"
        );


    container.innerHTML = "";


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "question-box";


    const number =
        document.createElement(
            "div"
        );


    number.className =
        "question-number";


    number.textContent =
        "Question " +
        (
            currentQuestionIndex + 1
        ) +
        " of " +
        currentQuestions.length;


    box.appendChild(
        number
    );


    const questionText =
        document.createElement(
            "div"
        );


    questionText.className =
        "question-text";


    questionText.textContent =
        question.q;


    box.appendChild(
        questionText
    );


    question.options.forEach(
        function(
            option,
            optionIndex
        ) {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            if(
                answers[
                    currentQuestionIndex
                ] === optionIndex
            ) {

                label.classList.add(
                    "selected"
                );
            }


            const radio =
                document.createElement(
                    "input"
                );


            radio.type =
                "radio";


            radio.name =
                "practiceAnswer";


            radio.value =
                optionIndex;


            radio.checked =
                answers[
                    currentQuestionIndex
                ] === optionIndex;


            radio.addEventListener(
                "change",
                function() {

                    answers[
                        currentQuestionIndex
                    ] =
                        optionIndex;


                    renderCurrentQuestion();

                }
            );


            label.appendChild(
                radio
            );


            label.appendChild(
                document.createTextNode(
                    " " + option
                )
            );


            box.appendChild(
                label
            );

        }
    );


    container.appendChild(
        box
    );


    updateProgress();

    updateButtons();
}


/* ==========================================
   PROGRESS
========================================== */

function updateProgress() {

    const questionNumber =
        currentQuestionIndex + 1;


    document
    .getElementById(
        "questionCounter"
    )
    .textContent =
        "Question " +
        questionNumber +
        " of " +
        currentQuestions.length;


    const percentage =
        (
            questionNumber /
            currentQuestions.length
        ) * 100;


    document
    .getElementById(
        "progressFill"
    )
    .style.width =
        percentage + "%";
}


/* ==========================================
   BUTTONS
========================================== */

function updateButtons() {

    const previousBtn =
        document
        .getElementById(
            "previousBtn"
        );


    const nextBtn =
        document
        .getElementById(
            "nextBtn"
        );


    const submitBtn =
        document
        .getElementById(
            "submitBtn"
        );


    previousBtn.disabled =
        currentQuestionIndex === 0;


    previousBtn.style.opacity =
        currentQuestionIndex === 0
        ? "0.5"
        : "1";


    if(
        currentQuestionIndex ===
        currentQuestions.length - 1
    ) {

        nextBtn.style.display =
            "none";


        submitBtn.style.display =
            "inline-block";

    } else {

        nextBtn.style.display =
            "inline-block";


        submitBtn.style.display =
            "none";
    }
}
/* ==========================================
   NEXT QUESTION
========================================== */

function nextQuestion() {

    if(
        currentQuestionIndex <
        currentQuestions.length - 1
    ) {

        currentQuestionIndex++;

        renderCurrentQuestion();
    }
}


/* ==========================================
   PREVIOUS QUESTION
========================================== */

function previousQuestion() {

    if(
        currentQuestionIndex > 0
    ) {

        currentQuestionIndex--;

        renderCurrentQuestion();
    }
}


/* ==========================================
   SUBMIT TEST
========================================== */

function submitTest() {

    let correctAnswers = 0;

    currentQuestions.forEach(
        function(question, index) {

            if (
                answers[index] !== null &&
                Number(answers[index]) ===
                Number(question.answer)
            ) {
                correctAnswers++;
            }

        }
    );

    const total =
        currentQuestions.length;

    const score =
        total > 0
        ? Math.round(
            (correctAnswers / total) * 100
        )
        : 0;

    /* IMPORTANT:
       Show the level selected by user.
       Do NOT calculate Beginner/Intermediate/Advanced
       from score.
    */

    const selectedLevel =
        currentLevel ||
        document
            .getElementById("levelSelect")
            .value;

    localStorage.setItem(
        "practice_score",
        String(score)
    );

    localStorage.setItem(
        "practice_level",
        selectedLevel
    );

    localStorage.setItem(
        "practice_correct",
        String(correctAnswers)
    );

    localStorage.setItem(
        "practice_total",
        String(total)
    );

    localStorage.setItem(
        "practice_career",
        currentCareer
    );

    document
        .getElementById("testScreen")
        .classList.add("hidden");

    document
        .getElementById("resultScreen")
        .classList.remove("hidden");

    document
        .getElementById("scoreValue")
        .textContent =
            score;

    document
        .getElementById("resultLevel")
        .textContent =
            selectedLevel;

    document
        .getElementById("correctValue")
        .textContent =
            correctAnswers;

    document
        .getElementById("totalValue")
        .textContent =
            total;

    updateResultMessage();
}
/* ==========================================
   RESULT MESSAGE
========================================== */

function updateResultMessage() {

    const lang =
        document
        .getElementById(
            "languageSelect"
        )
        .value;


    const t =
        translations[lang];


    const score =
        Number(
            localStorage.getItem(
                "practice_score"
            ) || 0
        );


    let message = "";


    if(score >= 80) {

        message =
            t.excellent;

    } else if(score >= 50) {

        message =
            t.good;

    } else {

        message =
            t.keep;
    }


    document
    .getElementById(
        "resultMessage"
    )
    .textContent =
        message;
}

}

/* ==========================================
   LOAD 100 COURSES
========================================== */

function updateCourseDropdown() {

    const select =
        document
        .getElementById(
            "careerSelect"
        );


    if(
        !select ||
        typeof courseCatalog ===
        "undefined"
    ) {
        return;
    }


    const oldValue =
        select.value;


    select.innerHTML = "";


    const lang =
        document
        .getElementById(
            "languageSelect"
        )
        .value;


    const t =
        translations[lang];


    const placeholder =
        document.createElement(
            "option"
        );


    placeholder.value = "";

    placeholder.textContent =
        t.selectCareer;


    select.appendChild(
        placeholder
    );


    Object.keys(
        courseCatalog
    ).forEach(
        function(course) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                course;


            option.textContent =
                course;


            select.appendChild(
                option
            );

        }
    );


    if(
        oldValue &&
        courseCatalog[oldValue]
    ) {

        select.value =
            oldValue;
    }


    const status =
        document
        .getElementById(
            "courseStatus"
        );


    if(status) {

        status.textContent =
            t.courseLoaded;
    }
}

<script>
(function () {
  function setupCareerDropdown() {
    const sel = document.getElementById("careerSelect");
    if (!sel || sel.dataset.customDropdown === "yes") return;

    sel.dataset.customDropdown = "yes";

    const wrap = document.createElement("div");
    wrap.className = "cs-wrap";
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    /* Keep the real select for existing project JavaScript */
    sel.style.setProperty("display", "none", "important");

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cs-btn";

    const panel = document.createElement("div");
    panel.className = "cs-panel";

    const list = document.createElement("ul");
    list.className = "cs-list";
    panel.appendChild(list);

    wrap.append(btn, panel);

    function updateLabel() {
      btn.textContent =
        sel.options[sel.selectedIndex]?.text || "Select Career";
    }

    function renderCourses() {
      list.replaceChildren();

      Array.from(sel.options).forEach((option, index) => {
        const item = document.createElement("li");
        item.textContent = option.text;
        if (index === sel.selectedIndex) item.classList.add("sel");

        item.addEventListener("click", function () {
          sel.selectedIndex = index;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          updateLabel();
          wrap.classList.remove("open");
        });

        list.appendChild(item);
      });

      updateLabel();
    }

    btn.addEventListener("click", function () {
      wrap.classList.toggle("open");
      if (wrap.classList.contains("open")) renderCourses();
    });

    sel.addEventListener("change", updateLabel);

    document.addEventListener("click", function (event) {
      if (!wrap.contains(event.target)) {
        wrap.classList.remove("open");
      }
    });

    /* Handles courses added later by existing JavaScript */
    const observer = new MutationObserver(renderCourses);
    observer.observe(sel, { childList: true, subtree: true });

    renderCourses();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupCareerDropdown);
  } else {
    setupCareerDropdown();
  }
})();
</script>

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", installCareerDropdown);
  } else {
    installCareerDropdown();
  }
})();
</script>
