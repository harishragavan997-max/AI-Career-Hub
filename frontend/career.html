function translateCareerPage(language) {

    const t = careerTranslations[language] ||
              careerTranslations.English;

    document.getElementById("title").innerText = t.title;

    document.getElementById("heading").innerText = t.heading;

    document.getElementById("description").innerText =
        t.description;

    document.getElementById("interestLabel").innerText =
        t.interest;

    document.getElementById("levelLabel").innerText =
        t.level;

    document.getElementById("discoverBtn").innerText =
        t.discover;


    const interest = document.getElementById("interest");

    interest.options[0].text = t.ai;
    interest.options[1].text = t.dataScience;
    interest.options[2].text = t.web;
    interest.options[3].text = t.software;
    interest.options[4].text = t.cyber;
    interest.options[5].text = t.cloud;


    const level = document.getElementById("level");

    level.options[0].text = t.beginner;
    level.options[1].text = t.intermediate;
    level.options[2].text = t.advanced;
}


function updateCareerLanguage() {

    const language =
        localStorage.getItem("selectedLanguage") || "English";

    translateCareerPage(language);
}


async function discoverCareer() {

    const interest =
        document.getElementById("interest").value;

    const level =
        document.getElementById("level").value;

    const result =
        document.getElementById("result");

    const language =
        localStorage.getItem("selectedLanguage") || "English";

    const t =
        careerTranslations[language] ||
        careerTranslations.English;


    result.innerText = t.thinking;


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/career-discovery",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    interest: interest,
                    level: level
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            result.innerText =
                "❌ " +
                (data.detail || "Career discovery failed.");

            return;
        }


        localStorage.setItem(
            "user_career",
            data.recommended_career
        );

        localStorage.setItem(
            "user_level",
            level
        );


        result.innerHTML = `

            <h3>${t.recommended}</h3>

            <h2>🎯 ${data.recommended_career}</h2>

            <p>
                Current Level:
                <strong>${level}</strong>
            </p>

            <br>

            <button onclick="goToAssessment()">
                ${t.next}
            </button>

        `;

    } catch (error) {

        console.log(error);

        result.innerText =
            "❌ Server connection error. Please start FastAPI.";
    }
}

function goToAssessment() {

    const career = localStorage.getItem("user_career") || "";
    const level = localStorage.getItem("user_level") || "Beginner";

    if (!career) {
        alert("Please discover your career first.");
        return;
    }

    // Save career using all common keys
    localStorage.setItem("user_career", career);

    localStorage.setItem("selected_course", career);
    localStorage.setItem("selectedCourse", career);

    localStorage.setItem("selected_career", career);
    localStorage.setItem("selectedCareer", career);

    localStorage.setItem("career", career);
    localStorage.setItem("target_career", career);
    localStorage.setItem("targetCareer", career);

    // Save selected level
    localStorage.setItem("user_level", level);
    localStorage.setItem("selected_level", level);
    localStorage.setItem("selectedLevel", level);

    // Send career directly to assessment page too
    window.location.href =
        "assessment.html?course=" +
        encodeURIComponent(career) +
        "&level=" +
        encodeURIComponent(level);
}



document.addEventListener(
    "DOMContentLoaded",

        updateCareerLanguage();

        const selector =
            document.getElementById("languageSelector");

        if (selector) {

            selector.addEventListener(
                "change",
                function() {

                    translateCareerPage(
                        this.value
                    );

                }
            );
        }
    }
);
