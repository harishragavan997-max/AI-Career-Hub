<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Career Hub - Register</title>

    <link rel="stylesheet" href="style.css">
    <script src="./language.js"></script>
</head>

<body>

<div class="container">

    <div class="card">

        <h1 id="title">🚀 AI Career Hub</h1>

        <h2 id="heading">📝 Create Your Account</h2>

        <label id="nameLabel">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">

        <label id="emailLabel">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label id="passwordLabel">Password</label>
        <input type="password" id="password" placeholder="Enter your password">

        <br>

        <button id="registerBtn" onclick="registerUser()">
            📝 Register
        </button>

        <p id="loginText">
            Already have an account?
            <a href="login.html" id="loginLink">Login</a>
        </p>

        <p id="message"></p>

    </div>

</div>


<script>

        password: "கடவுச்சொல்",
        passwordPlaceholder: "உங்கள் கடவுச்சொல்லை உள்ளிடவும்",
        register: "📝 பதிவு செய்யவும்",

    Hindi: {
        title: "🚀 AI Career Hub",
        heading: "📝 अपना खाता बनाएं",
        name: "पूरा नाम",
        namePlaceholder: "अपना पूरा नाम दर्ज करें",

    Thanglish: {

        passwordPlaceholder: "Un password-ah enter pannu",
        register: "📝 Register Pannu",
        loginText: "Already account irukka?",
        login: "Login Pannu"
    },

    Kannada: {
        title: "🚀 AI Career Hub",
        heading: "📝 ನಿಮ್ಮ ಖಾತೆಯನ್ನು ರಚಿಸಿ",

        namePlaceholder: "ನಿಮ್ಮ ಪೂರ್ಣ ಹೆಸರನ್ನು ನಮೂದಿಸಿ",
        email: "ಇಮೇಲ್",
        emailPlaceholder: "ನಿಮ್ಮ ಇಮೇಲ್ ನಮೂದಿಸಿ",

    },

    Malayalam: {
        title: "🚀 AI Career Hub",
        heading: "📝 നിങ്ങളുടെ അക്കൗണ്ട് സൃഷ്ടിക്കുക",
        name: "പൂർണ്ണ പേര്",
        namePlaceholder: "നിങ്ങളുടെ പൂർണ്ണ പേര് നൽകുക",
        email: "ഇമെയിൽ",
        emailPlaceholder: "നിങ്ങളുടെ ഇമെയിൽ നൽകുക",
        password: "പാസ്‌വേഡ്",
        passwordPlaceholder: "നിങ്ങളുടെ പാസ്‌വേഡ് നൽകുക",
        register: "📝 രജിസ്റ്റർ ചെയ്യുക",
        loginText: "ഇതിനകം അക്കൗണ്ട് ഉണ്ടോ?",
        login: "ലോഗിൻ"
    }

};


// ===== APPLY TRANSLATION =====

function translateRegisterPage(language) {

    const t =
        registerTranslations[language] ||
        registerTranslations.English;

    document.getElementById("title").innerText = t.title;

    document.getElementById("heading").innerText = t.heading;

    document.getElementById("nameLabel").innerText = t.name;

    document.getElementById("name").placeholder =
        t.namePlaceholder;

    document.getElementById("emailLabel").innerText = t.email;

    document.getElementById("email").placeholder =
        t.emailPlaceholder;

    document.getElementById("passwordLabel").innerText =
        t.password;

    document.getElementById("password").placeholder =
        t.passwordPlaceholder;

    document.getElementById("registerBtn").innerText =
        t.register;

    document.getElementById("loginText").innerHTML =
        t.loginText + ' <a href="login.html" id="loginLink">' +
        t.login +
        '</a>';
}


// ===== LANGUAGE CHANGE =====

function updateRegisterLanguage() {

    const language =
        localStorage.getItem("selectedLanguage") ||
        "English";

    translateRegisterPage(language);

}


// ===== REGISTER FUNCTION =====

async function registerUser() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if (!name || !email || !password) {

        message.innerText =
            "❌ Please fill all fields.";

        return;
    }


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            message.innerText =
                "❌ " +
                (data.detail ||
                "Registration failed.");

            return;
        }


        message.innerText =
            "🎉 Registration successful!";


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1200);


    } catch (error) {

        console.log(error);

        message.innerText =
            "❌ Server connection error.";

    }

}


// ===== PAGE LOAD =====

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateRegisterLanguage();

        const selector =
            document.getElementById("languageSelector");

        if (selector) {

            selector.addEventListener(
                "change",
                function() {

                    translateRegisterPage(
                        this.value
                    );

                }
            );

        }

    }
);

</script>

</body>
</html>
