let currentAssessmentQuestions = [];

let currentQuestionIndexes = [];
function getUsedAssessmentQuestions() {

    try {

        return JSON.parse(
            localStorage.getItem("usedAssessmentQuestions") || "[]"
        );

    } catch (error) {

        return [];

    }

}


function saveUsedAssessmentQuestions(used) {

    localStorage.setItem(
        "usedAssessmentQuestions",
        JSON.stringify(used)
    );

}


function shuffleArray(array) {

    const shuffled = [...array];

    for (
        let i = shuffled.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }

    return shuffled;

}


function getRandomAssessmentQuestions() {

    let used =
        getUsedAssessmentQuestions();

    let availableIndexes = [];

    for (
        let i = 0;
        i < assessmentQuestionBank.length;
        i++
    ) {

        if (!used.includes(i)) {

            availableIndexes.push(i);

        }

    }


    /*
       5 questions are required.

       If fewer than 5 unused questions remain,
       start a new cycle after this attempt.
    */

    if (availableIndexes.length < 5) {

        used = [];

        availableIndexes = [];

        for (
            let i = 0;
            i < assessmentQuestionBank.length;
            i++
        ) {

            availableIndexes.push(i);

        }

    }


    availableIndexes =
        shuffleArray(availableIndexes);


    const selectedIndexes =
        availableIndexes.slice(0, 5);


    const newUsed =
        used.concat(selectedIndexes);


    saveUsedAssessmentQuestions(newUsed);


    currentQuestionIndexes =
        selectedIndexes;


    return selectedIndexes.map(
        function(index) {

            return assessmentQuestionBank[index];

        }
    );

}
function loadRandomAssessmentQuestions() {

    currentAssessmentQuestions =
        getRandomAssessmentQuestions();


    const container =
        document.getElementById(
            "questionsContainer"
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    currentAssessmentQuestions.forEach(
        function(question, index) {

            const questionNumber =
                index + 1;


            const card =
                document.createElement("div");


            card.className =
                "question-card";


            const heading =
                document.createElement("h3");


            heading.innerText =
                questionNumber +
                ". " +
                question.q;


            card.appendChild(heading);


            question.options =
                shuffleArray(question.options);


            question.options.forEach(
                function(option, optionIndex) {

                    const label =
                        document.createElement("label");


                    label.className =
                        "option-label";


                    const radio =
                        document.createElement("input");


                    radio.type =
                        "radio";

                    radio.name =
                        "q" + questionNumber;

                    radio.value =
                        option;


                    const span =
                        document.createElement("span");


                    span.innerText =
                        option;


                    label.appendChild(radio);

                    label.appendChild(span);


                    card.appendChild(label);


                    radio.addEventListener(
                        "change",
                        function() {

                            card
                                .querySelectorAll(
                                    ".option-label"
                                )
                                .forEach(
                                    function(item) {

                                        item.classList.remove(
                                            "selected"
                                        );

                                    }
                                );


                            label.classList.add(
                                "selected"
                            );

                        }
                    );

                }
            );


            const feedback =
                document.createElement("p");


            feedback.className =
                "feedback";


            feedback.id =
                "feedback" +
                questionNumber;


            card.appendChild(feedback);


            container.appendChild(card);

        }
    );

}

        localStorage.getItem(
            "selected_career"

            "whatif_target_career"

        "submitBtn"

        "resultTitle"
    ).innerText =
        t.result;


    document.getElementById(
        "continueBtn"
    ).innerText =
        t.continue;


    document.getElementById(
        "backDashboardBtn"
    ).innerText =
        t.back;

}
async function submitAssessment() {

    if (
        !currentAssessmentQuestions ||
        currentAssessmentQuestions.length !== 5
    ) {

        alert(
            "Assessment questions are not loaded."
        );

        return;

    }


    let score = 0;


    const language =
        getLanguage();


    const t =
        assessmentTranslations[language] ||
        assessmentTranslations.English;


    for (
        let i = 0;
        i < currentAssessmentQuestions.length;
        i++
    ) {

        const questionNumber =
            i + 1;


        const selected =
            document.querySelector(
                'input[name="q' +
                questionNumber +
                '"]:checked'
            );


        const feedback =
            document.getElementById(
                "feedback" +
                questionNumber
            );


        if (!selected) {

            feedback.innerText =
                t.unanswered;

            feedback.style.color =
                "#f59e0b";

            continue;

        }


        if (
            selected.value ===
            currentAssessmentQuestions[i].answer
        ) {

            score++;


            feedback.innerText =
                t.correct;

            feedback.style.color =
                "#22c55e";

        } else {

            feedback.innerText =
                t.wrong;

            feedback.style.color =
                "#ef4444";

        }

    }


    try {

        const response =
            await fetch(
                "http://127.0.0.1:8000/skill-assessment",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        score: score,
                        total: 5
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Backend Error"
            );

        }


        const data =
            await response.json();


        localStorage.setItem(
            "assessment_score",
            data.percentage
        );


        localStorage.setItem(
            "assessment_percentage",
            data.percentage
        );


        localStorage.setItem(
            "user_level",
            data.level
        );


        const result =
            document.getElementById(
                "result"
            );


        result.style.display =
            "block";


        document.getElementById(
            "scoreText"
        ).innerText =
            t.score +
            ": " +
            score +
            " / 5";


        document.getElementById(
            "percentageText"
        ).innerText =
            t.percentage +
            ": " +
            Number(
                data.percentage
            ).toFixed(2) +
            "%";


        document.getElementById(
            "levelText"
        ).innerText =
            t.level +
            ": " +
            data.level;


        result.scrollIntoView({
            behavior: "smooth"
        });


        document.getElementById(
            "submitBtn"
        ).disabled =
            true;

    }

    catch (error) {

        console.error(error);

        alert(
            "Backend connection error. Please make sure FastAPI is running."
        );

    }

}
function goToVerification() {

    window.location.href =
        "career-verify.html";

}


function goToDashboard() {

    window.location.href =
        "dashboard.html";

}
document.addEventListener(
    "DOMContentLoaded",
    function() {

        const selector =
            document.getElementById(
                "languageSelector"
            );


        const savedLanguage =
            localStorage.getItem(
                "selectedLanguage"
            ) || "English";


        if (selector) {

            selector.value =
                savedLanguage;


            selector.addEventListener(
                "change",
                function() {

                    localStorage.setItem(
                        "selectedLanguage",
                        this.value
                    );


                    translateAssessmentPage();

                }
            );

        }


        loadRandomAssessmentQuestions();


        translateAssessmentPage();

    }
);
function preventMultipleSubmit() {

    const submitButton =
        document.getElementById(
            "submitBtn"
        );


    if (!submitButton) {
        return;
    }


    submitButton.addEventListener(
        "click",
        function() {

            if (
                submitButton.disabled
            ) {

                return;

            }

        }
    );

}


function clearOldAssessmentResult() {

    const result =
        document.getElementById(
            "result"
        );


    if (result) {

        result.style.display =
            "none";

    }

}


preventMultipleSubmit();

clearOldAssessmentResult();

</script>
